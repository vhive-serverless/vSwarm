apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fibonacci-python
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        autoscaling.knative.dev/target: "100"
        serving.knative.dev/containerConcurrency: "100"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 60
      containers:
        - name: relay
          image: docker.io/vhiveease/relay:latest
          ports:
            - name: h2c
              containerPort: 50000
          args:
            - --addr=0.0.0.0:50000
            - --function-endpoint-url=0.0.0.0
            - --function-endpoint-port=50051
            - --function-name=fibonacci-python
            - --value=10
            - --generator=linear
            - --lowerBound=1
            - --upperBound=10
          resources:
            requests:
              cpu: "125m"
              memory: "256Mi"
            limits:
              cpu: "125m"
              memory: "256Mi"
        - name: fibonacci-python
          image: docker.io/vhiveease/fibonacci-python:latest
          args:
            - --addr=0.0.0.0
            - --port=50051
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"      
            limits:
              cpu: "1000m"      
              memory: "1Gi"      